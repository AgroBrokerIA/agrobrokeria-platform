name: Web CI
# Launch validation: production-ready main branch

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Dependency security audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); const findings=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,findings},null,2));'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
