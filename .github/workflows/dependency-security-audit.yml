name: Dependency Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate lockfile for patched direct dependencies
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply compatible transitive security fixes
        working-directory: apps/web
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify clean locked install
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Generate audit report
        working-directory: apps/web
        shell: bash
        run: npm audit --json > npm-audit.json || true

      - name: Print vulnerability details
        working-directory: apps/web
        shell: bash
        run: |
          node <<'NODE'
          const report = require('./npm-audit.json');
          console.log('VULNERABILITY SUMMARY');
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via
            }));
          }
          NODE

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "security: refresh dependency lockfile with patched packages"
          git push
